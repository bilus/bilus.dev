# Replaces the packaged /etc/nginx/conf.d/default.conf, so this is a server
# block rather than a full nginx configuration.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hugo generates its own themed 404 page. Without this, nginx answers
    # missing paths with its built-in one instead.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Hugo fingerprints files under /assets/, so a given URL never changes
    # content and can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;
}
